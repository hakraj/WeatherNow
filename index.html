<!-- UV Index Card -->
<div
  id="uv-card"
  class="weather-card bg-card border border-border rounded-2xl p-5 transition-all duration-300"
>
  <h3 class="text-muted-foreground text-sm mb-4">UV Index</h3>

  <div class="flex justify-center mb-4">
    <div class="relative w-24 h-12">
      <svg viewBox="0 0 100 50" class="w-full h-full">
        <!-- Background arc -->
        <path
          id="uv-bg"
          d="M 10 45 A 40 40 0 0 1 90 45"
          fill="none"
          stroke="hsl(var(--muted))"
          stroke-width="8"
          stroke-linecap="round"
        />

        <!-- Dynamic arc -->
        <path
          id="uv-progress"
          d="M 10 45 A 40 40 0 0 1 90 45"
          fill="none"
          stroke="hsl(var(--primary))"
          stroke-width="8"
          stroke-linecap="round"
          stroke-dasharray="126"
          stroke-dashoffset="126"
        />

        <!-- Scale labels -->
        <text x="7" y="48" class="text-[8px] fill-muted-foreground">0</text>
        <text x="16" y="24" class="text-[8px] fill-muted-foreground">3</text>
        <text x="50" y="10" class="text-[8px] fill-muted-foreground">6</text>
        <text x="80" y="24" class="text-[8px] fill-muted-foreground">8</text>
        <text x="85" y="48" class="text-[8px] fill-muted-foreground">11+</text>
      </svg>
    </div>
  </div>

  <div class="text-center">
    <span
      id="uv-value"
      class="text-2xl font-semibold text-foreground"
    >--</span>
    <span class="text-muted-foreground text-sm ml-1">UV</span>
  </div>
</div>
